# Northline Q3 2026 R&M: Finance rules for the build.
#
# OWNER: Finance.
# This file holds only the Finance rules from data/raw/README.md and the
# decisions recorded in docs/decisions.md. Each value cites its source:
# README rule n or D-nn. Everything else the build needs lives in
# config/pipeline.toml (owned by Data Engineering).
#
# Single source of truth for rule values: the SQL in sql/ reads every rule
# from here, and nothing in sql/ or run.py restates them.
#
# run.py loads this file and config/pipeline.toml into DuckDB:
#   a value or a list of values  -> variable <section>_<key>   e.g. getvariable('period_start')
#   a list of tables             -> table cfg_<section>_<key>  e.g. cfg_erp_a_whse_map
# The two files share section names; a key defined in both fails the build.

[period]                         # README rule 3: Q3 2026, each line by its own date
start = 2026-07-01
end = 2026-09-30

[rm]
group_accounts = [6100, 6150, 6200]    # README rule 1: R&M is these group accounts only
capitalised_operations = [75, 100]     # README rule 2: every line on these SRO operations is excluded

[[branches.reassign]]            # README rule 4: Elmwood closed 31-Jul-2026. D-12: no ELM rows after July
from_branch = "ELM"
to_branch = "OAK"
effective_from = 2026-08-01

[erp_a]
date_formats = ["%Y-%m-%d", "%m/%d/%Y"]    # D-03 (tried in this order)
dedupe_key = ["SRO", "Line"]               # D-01
dedupe_keep = "latest"                     # D-01: keep the copy with the latest ExportedAt ("latest" or "earliest")
last_export_cutoff = 2026-09-30T18:00:00   # README; D-02: a check, not a filter

# D-04: every raw Whse value, exactly as typed (case and spaces included), to its branch.
whse_map = [
  { raw = "RIV",       branch = "RIV" },
  { raw = "riv",       branch = "RIV" },
  { raw = "RIV ",      branch = "RIV" },
  { raw = "Riverton ", branch = "RIV" },
  { raw = "OAK",       branch = "OAK" },
  { raw = "oak",       branch = "OAK" },
  { raw = " OAK",      branch = "OAK" },
  { raw = "Oakdale",   branch = "OAK" },
  { raw = "PIN",       branch = "PIN" },
  { raw = "pin",       branch = "PIN" },
  { raw = "PIN ",      branch = "PIN" },
  { raw = "Pinecrest", branch = "PIN" },
  { raw = "ELM",       branch = "ELM" },
  { raw = "Elmwood",   branch = "ELM" },
]

[erp_b]
date_formats = ["%d/%m/%Y"]                     # D-03
subtotal_marker = "SUBTOTAL"                    # D-06: JournalID of subtotal rows (excluded, used as a control)
journal_id_pattern = "^LK[0-9]+$"               # D-06: every other row must be a journal line
thousands_separator = ","                       # D-06: stripped before reading the amount
rm_local_account_pattern = "^73[0-9]{2}-RM"     # README rule 6; D-05: the range decides, not the map

[fx]
rate_column = "AvgRate_CADtoUSD"                # README rule 5: monthly average rate

[rounding]                                      # D-07
mode = "half_up"                                # DuckDB ROUND on DECIMAL; equal to half-up for positive totals
decimals = 2                                    # README rule 8: cents
cast_noise_tolerance = 0.000001                 # D-07: casting to cents may only remove float noise
